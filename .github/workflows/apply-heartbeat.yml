name: Apply heartbeat patch and build bundle

# 把"心跳链"的补丁脚本（.github/scripts/apply_heartbeat*.py，按文件名顺序）依次打到
# worker/amsg/src/index.ts、triggerGate.ts 和 trigger-service/server.js 上，提交回分支，
# 然后构建带心跳的 worker.bundle.js，在本次运行页面底部 Artifacts 下载。
# 每个补丁都可重复运行：已经打过就跳过。以后新增补丁只需加一个 apply_heartbeatN.py。
on:
  push:
    branches: [trigger-gate]
    paths:
      - '.github/scripts/apply_heartbeat*.py'
      - '.github/workflows/apply-heartbeat.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: trigger-gate

      - name: Apply patches in order
        run: |
          for f in .github/scripts/apply_heartbeat*.py; do
            echo "== $f"
            python3 "$f"
          done

      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/amsg/src trigger-service
          if git diff --cached --quiet; then
            echo "没有需要提交的改动（补丁已经打过）"
          else
            git commit -m "feat: 心跳补丁（醒来记录 + 日记工具 + 称呼）"
            git pull --rebase origin trigger-gate
            git push origin HEAD:trigger-gate
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build:workers

      - name: Check the patches are inside the bundle
        run: |
          # 打包工具会把中文转成 \uXXXX 编码，所以这里只搜英文标记（字符串字面量 / 属性名不会被改写）。
          for m in "amsg:heartbeat" "watch-window-over" "lastSelfSendAt" "asleep" "wake/result"; do
            grep -q "$m" worker/amsg/worker.bundle.js || {
              echo "bundle 里没有标记 $m，对应的补丁可能没打上。"
              exit 1
            }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: amsg-worker-bundle-heartbeat
          path: worker/amsg/worker.bundle.js
