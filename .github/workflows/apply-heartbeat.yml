name: Apply heartbeat patch and build bundle

# 把"心跳链"的补丁脚本（.github/scripts/apply_heartbeat*.py，按文件名顺序）依次打到
# worker/amsg/src/index.ts、triggerGate.ts 和 trigger-service/server.js 上，提交回分支，
# 然后构建带心跳的 worker.bundle.js，在本次运行页面底部 Artifacts 下载。
# 每个补丁都可重复运行：已经打过就跳过。以后新增补丁只需加一个 apply_heartbeatN.py。
# （Actions 重新启用后手动触发过一次，补跑被跳过的补丁 5。）
on:
  push:
    branches: [trigger-gate]
    paths:
      - '.github/scripts/apply_heartbeat*.py'
      - '.github/workflows/apply-heartbeat.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: trigger-gate

      - name: Apply patches in order
        run: |
          for f in .github/scripts/apply_heartbeat*.py; do
            echo "== $f"
            python3 "$f"
          done

      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/amsg/src trigger-service
          if git diff --cached --quiet; then
            echo "没有需要提交的改动（补丁已经打过）"
          else
            git commit -m "feat: 心跳补丁（夹带夜间不再勿扰）"
            git push origin HEAD:trigger-gate
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build:workers

      - name: Check the patches are inside the bundle
        run: |
          grep -q "amsg:heartbeat" worker/amsg/worker.bundle.js || {
            echo "bundle 里没有心跳代码，补丁可能没打上。"
            exit 1
          }
          grep -q "例行醒来" worker/amsg/worker.bundle.js || {
            echo "bundle 里没有「默认不说」的补丁 2。"
            exit 1
          }
          grep -q "别发消息吵醒他" worker/amsg/worker.bundle.js || {
            echo "bundle 里没有「夜间不再勿扰」的补丁 3。"
            exit 1
          }
          grep -q "watch-window-over" worker/amsg/worker.bundle.js || {
            echo "bundle 里没有触发闸代码。"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: amsg-worker-bundle-heartbeat
          path: worker/amsg/worker.bundle.js
