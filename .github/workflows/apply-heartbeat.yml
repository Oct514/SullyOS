name: Apply heartbeat patch and build bundle

# 把"心跳链"补丁依次打到 worker/amsg/src/index.ts、triggerGate.ts 和 trigger-service/server.js 上，
# 提交回分支，然后构建带心跳的 worker.bundle.js，在本次运行页面底部 Artifacts 下载。
# 补丁可重复运行：已经打过就跳过。
on:
  push:
    branches: [trigger-gate]
    paths:
      - '.github/scripts/apply_heartbeat.py'
      - '.github/scripts/apply_heartbeat2.py'
      - '.github/workflows/apply-heartbeat.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: trigger-gate

      - name: Apply heartbeat patch
        run: python3 .github/scripts/apply_heartbeat.py

      - name: Apply speak-block patch
        run: python3 .github/scripts/apply_heartbeat2.py

      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/amsg/src trigger-service
          if git diff --cached --quiet; then
            echo "没有需要提交的改动（补丁已经打过）"
          else
            git commit -m "feat: 心跳默认不说 + 按谁说了最后一句决定醒不醒"
            git push origin HEAD:trigger-gate
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build:workers

      - name: Check the heartbeat is inside the bundle
        run: |
          grep -q "amsg:heartbeat" worker/amsg/worker.bundle.js || {
            echo "bundle 里没有心跳代码，补丁可能没打上。"
            exit 1
          }
          grep -q "rewriteSpeakBlock\|例行醒来" worker/amsg/worker.bundle.js || {
            echo "bundle 里没有「默认不说」的补丁 2。"
            exit 1
          }
          grep -q "watch-window-over" worker/amsg/worker.bundle.js || {
            echo "bundle 里没有触发闸代码。"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: amsg-worker-bundle-heartbeat
          path: worker/amsg/worker.bundle.js
