name: Branch check

# 分支自检：非 master 分支每次推送、以及往 master 提的 PR，都跑一遍 worker 打包 + 相关单测。
# 只读、不部署，用来在合并前发现编译/测试错误。
#
# 单测只跑 worker/ 和 utils/amsg* 这两块（主动消息相关）。其余测试（live2d、分享导出等）
# 依赖浏览器环境，在 CI 的纯 Node 里本来就会报 "navigator is not defined"，跟我们的改动无关。

on:
  push:
    branches-ignore: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: branch-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workers
        run: pnpm run build:workers

      - name: Unit tests (amsg only)
        run: pnpm exec vitest run worker utils/amsg
